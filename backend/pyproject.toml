[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixthecity-backend"
version = "0.1.0"
description = "FastAPI backend for CityFix"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
