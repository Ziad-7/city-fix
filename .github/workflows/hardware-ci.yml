name: hardware-ci

on:
  push:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-ci.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library simulator tests
        run: python -m unittest discover -s hardware/simulator/tests -v

  firmware:
    name: Firmware build (when present)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect firmware project
        id: guard
        run: |
          if [ -f hardware/firmware/platformio.ini ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "hardware/firmware/platformio.ini not found, skipping."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.exists == 'true'
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        if: steps.guard.outputs.exists == 'true'
        run: pip install platformio
      - name: Prepare placeholder secrets
        if: steps.guard.outputs.exists == 'true'
        working-directory: hardware/firmware
        run: |
          if [ -f include/secrets.example.h ] && [ ! -f include/secrets.h ]; then
            cp include/secrets.example.h include/secrets.h
          fi
      - name: Build firmware
        if: steps.guard.outputs.exists == 'true'
        working-directory: hardware/firmware
        run: pio run
