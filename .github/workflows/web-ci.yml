concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The website copies shared files from apps/mobile/src (see apps/web/scripts/check-shared.sh),
# so the mobile paths above are exactly the files that script compares.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # The website's copy of the shared mobile code must match apps/mobile/src.
      - run: npm run check:shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_MODE: mock

  e2e:
    # Paused while the team is not working on the website: it fails at "config.webServer ... Exit code: 1"
    # (the `next build` it starts). To run it again, set the repository variable RUN_WEB_E2E to "true"
    # (Settings > Secrets and variables > Actions > Variables), or remove this line.
    if: ${{ vars.RUN_WEB_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      # Flake guard (pull requests): the timing-sensitive specs (offline queue, two tabs) run 10 times on both
      # projects with no retry, so a race fails on the PR instead of after the merge.
      - name: Flake guard (offline and multi-tab specs x10)
        if: github.event_name == 'pull_request'
        run: npx playwright test e2e/report-extras.spec.ts e2e/outbox-tabs.spec.ts --repeat-each=10 --retries=0
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
