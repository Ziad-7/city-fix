name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Skipped cleanly (job still reports green) until backend/ exists.
# The AI eval (backend/ai-eval) calls paid APIs and is deliberately not run here.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTP_MODE: demo
      JWT_SECRET: ci-dummy-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - name: Detect backend
        id: guard
        run: |
          if [ -f backend/pyproject.toml ] || ls backend/requirements*.txt >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend/pyproject.toml or requirements*.txt found, skipping."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.exists == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt
      - name: Install
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          fi
          for f in requirements*.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
          pip install ruff pytest
      - name: Ruff lint
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .
      - name: Ruff format
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: ruff format --check .
      - name: Mypy
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: >-
          mypy app/auth.py app/auth_adapters.py app/admin_auth.py
          app/map_repository.py app/citizen.py app/auth_demo.py app/citizen_demo.py
          app/staff_auth.py app/routers/auth.py app/routers/staff_auth.py
          --ignore-missing-imports --follow-imports=skip
      - name: Pytest
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: python -m pytest
