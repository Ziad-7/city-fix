<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">CityCycle system architecture</title>
<desc id="d">People use the mobile app, citizen website and Command Center. All three call one FastAPI backend that holds routing, forecast, hotspot, budget and priority logic, asks CityBrain for suggestions, and stores data in SQLite locally. Simulated smart bin and hub scale prototypes and a PC simulator send readings to the backend with a device key. PostgreSQL on Supabase, Supabase Storage and Vercel hosting are still to verify.</desc>
