<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityFix — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@500;600;700&amp;family=Aref+Ruqaa:wght@700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/cityfix.css">
</head>
<body>
<div class="ftc-docbar"><a href="../../index.html">CityFix design</a><span>Mobile app · Login</span></div>
<div style="width:390px;margin:24px auto;box-shadow:var(--ftc-shadow-float);overflow:hidden">
<div dir="rtl" style="width: 390px; height: 980px; box-sizing: border-box; background: #F8F6F2; color: #161616; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="position: relative; height: 310px; background: #C8102E; overflow: hidden; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; justify-content: flex-start; padding: 24px 20px 0; box-sizing: border-box;">
    <img src="../../assets/cairo-skyline.svg" alt="" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 150px;">
    <span style="position: relative; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: #FFFFFF;">
      <img src="../../assets/cityfix-mark.svg" alt="" style="width: 26px; height: 26px;">
      <span style="font-family: 'Readex Pro', sans-serif; font-size: 15px; font-weight: 700; color: #C8102E;">سيتي فيكس</span>
    </span>
    <h1 style="position: relative; margin: 12px 0 0; font-family: 'Aref Ruqaa', 'Readex Pro', serif; font-size: 30px; line-height: 46px; font-weight: 700; color: #FFFFFF;">مدينتك أحلى لما نصلّحها سوا</h1>
  </div>

  <main style="flex: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="phone" style="font-size: 14px; line-height: 22px; font-weight: 600;">رقم موبايلك</label>
      <div style="display: flex; height: 52px; border-radius: 14px; border: 1.5px solid #C8102E; background: #FFFFFF; overflow: hidden;">
        <span style="display: flex; align-items: center; gap: 6px; padding: 0 12px; border-inline-end: 1px solid #E6E1D8; font-size: 15px; font-weight: 600; color: #161616; flex-shrink: 0;">
          <svg aria-hidden="true" width="22" height="15" viewBox="0 0 22 15"><rect width="22" height="5" fill="#C8102E"></rect><rect y="5" width="22" height="5" fill="#FFFFFF"></rect><rect y="10" width="22" height="5" fill="#161616"></rect><circle cx="11" cy="7.5" r="1.6" fill="#D4A20B"></circle></svg>
          <bdi dir="ltr">+20</bdi>
        </span>
        <input id="phone" dir="ltr" inputmode="tel" value="010 1234 5678" style="text-align: right; flex: 1; min-width: 0; border: 0; outline: none; padding: 0 12px; font-family: inherit; font-size: 17px; letter-spacing: .5px; color: #161616; background: transparent;">
      </div>
      <span style="font-size: 12px; line-height: 18px; color: #5A5A5A;">فودافون، أورانج، اتصالات، أو WE — هنبعتلك كود من ٦ أرقام.</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="font-size: 14px; line-height: 22px; font-weight: 600; padding: 0; margin-bottom: 6px;">ابعتلي الكود على</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <label style="height: 48px; border-radius: 14px; border: 2px solid #C8102E; background: #FBE4E7; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #8E0A20;"><input type="radio" name="otp" checked style="accent-color: #C8102E; margin: 0;">رسالة SMS</label>
        <label style="height: 48px; border-radius: 14px; border: 1px solid #E6E1D8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500;"><input type="radio" name="otp" style="accent-color: #C8102E; margin: 0;">واتساب</label>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">المحافظة
        <select style="height: 48px; border-radius: 8px; border: 1px solid #E6E1D8; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #161616; padding: 0 10px; font-weight: 400;">
          <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>القليوبية</option>
        </select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">الحي
        <select style="height: 48px; border-radius: 8px; border: 1px solid #E6E1D8; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #161616; padding: 0 10px; font-weight: 400;">
          <option>مدينة نصر أول</option><option>مدينة نصر ثان</option><option>مصر الجديدة</option><option>المعادي</option>
        </select>
      </label>
    </div>

    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <span style="font-size: 13px; line-height: 21px; color: #161616;">رقمك مش هيظهر لحد. بنستخدمه بس عشان نبعتلك تحديثات بلاغك، وتقدر تبلّغ من غير اسم.</span>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px 14px;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M5 12.6a10 10 0 0 1 14 0"></path><path d="M8.5 16.1a5 5 0 0 1 7 0"></path><path d="M12 20h.01"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; line-height: 22px; font-weight: 600;">توفير باقة النت</span><span style="font-size: 12px; line-height: 18px; color: #5A5A5A;">صور أخف، والخريطة بتحمّل بس لما تفتحها</span></span>
      <span class="ftc-toggle is-on" role="switch" aria-checked="true" aria-label="توفير باقة النت" tabindex="0" style="flex:none"></span>
    </label>
  </main>

  <footer style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Main.html" style="height: 52px; border-radius: 14px; background: #C8102E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">ابعتلي الكود</a>
    <div style="display: flex; justify-content: center; gap: 16px; font-size: 13px;">
      <a href="#" style="font-weight: 600;">English</a>
      <span aria-hidden="true" style="color: #E6E1D8;">|</span>
      <a href="#" style="font-weight: 600;">خط أكبر</a>
    </div>
  </footer>
</div>
</div>
</body>
</html>
