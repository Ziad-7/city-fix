<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityFix — تسلم إيدك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@500;600;700&amp;family=Aref+Ruqaa:wght@700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/cityfix.css">
</head>
<body>
<div class="ftc-docbar"><a href="../../index.html">CityFix design</a><span>Mobile app · Success</span></div>
<div style="width:390px;margin:24px auto;box-shadow:var(--ftc-shadow-float);overflow:hidden">
<div dir="rtl" style="width: 390px; height: 900px; box-sizing: border-box; background: #F8F6F2; color: #161616; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="position: relative; height: 330px; background: #C8102E; overflow: hidden; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px 20px; box-sizing: border-box; text-align: center;">
    <span style="position: relative; width: 108px; height: 108px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(22,22,22,.18);">
      <img src="../../assets/cityfix-mark.svg" alt="" style="width: 72px; height: 72px;">
    </span>
    <h1 style="position: relative; margin: 10px 0 0; font-family: 'Aref Ruqaa', 'Readex Pro', serif; font-size: 40px; line-height: 56px; font-weight: 700; color: #FFFFFF;">تسلم إيدك!</h1>
    <p style="position: relative; margin: 0; font-size: 15px; line-height: 24px; color: #FBE4E7;">بلاغك وصل، ورقمه <strong style="color: #FFFFFF; font-weight: 700;"><bdi dir="ltr">#FTC-1043</bdi></strong></p>
  </div>

  <main style="flex: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <section aria-label="اللي جاي" style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(22,22,22,.06), 0 4px 16px rgba(22,22,22,.06);">
      <h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 16px; line-height: 24px; font-weight: 600;">اللي جاي</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 22px;">
        <li style="display: flex; gap: 10px; align-items: center;"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FBE4E7; color: #8E0A20; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">١</span>موظف الحي هيراجعه خلال ٢٤ ساعة</li>
        <li style="display: flex; gap: 10px; align-items: center;"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FBE4E7; color: #8E0A20; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">٢</span>هيتحوّل للجهة المسؤولة: صيانة الطرق</li>
        <li style="display: flex; gap: 10px; align-items: center;"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FBE4E7; color: #8E0A20; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">٣</span>هنبعتلك على واتساب في كل خطوة</li>
      </ol>
    </section>

    <section aria-label="لقب جديد" style="background: #FAF0D2; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg aria-hidden="true" width="56" height="56" viewBox="0 0 64 64" style="flex-shrink: 0;"><path d="M20 34 L12 60 L22 54 L28 62 L32 38 Z" fill="#C8102E"></path><path d="M44 34 L52 60 L42 54 L36 62 L32 38 Z" fill="#161616"></path><circle cx="32" cy="24" r="20" fill="#D4A20B"></circle><circle cx="32" cy="24" r="14.5" fill="none" stroke="#7A5A00" stroke-width="1.5"></circle><path d="M32 14.5l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2-4.6-4.4 6.3-.9z" fill="#161616"></path></svg>
        <span style="display: flex; flex-direction: column;">
          <span style="font-size: 12px; line-height: 18px; color: #7A5A00; font-weight: 600;">لقب جديد</span>
          <span style="font-family: 'Aref Ruqaa', 'Readex Pro', serif; font-size: 26px; line-height: 38px; font-weight: 700; color: #7A5A00;">جدع الشارع</span>
        </span>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #161616;">ده بلاغك رقم ٣. ٧ بلاغات كمان وتاخد لقب <strong style="font-weight: 700;">جدع الحي</strong>.</p>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span aria-hidden="true" style="flex: 1; height: 8px; border-radius: 999px; background: #FFFFFF; display: block;"><span style="display: block; width: 30%; height: 8px; border-radius: 999px; background: #7A5A00;"></span></span>
        <span style="font-size: 12px; font-weight: 700; color: #7A5A00;">٣ / ١٠</span>
      </div>
    </section>
  </main>

  <footer style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Track.html" style="height: 52px; border-radius: 14px; background: #C8102E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">تابع البلاغ</a>
    <button style="height: 48px; border-radius: 14px; border: 1.5px solid #C8102E; background: #FFFFFF; color: #C8102E; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">ابعته لجروب العمارة</button>
  </footer>
</div>
</div>
</body>
</html>
